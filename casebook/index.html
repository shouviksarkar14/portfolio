<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casebook Studio · demo</title>
<style>
:root{
  --bg:#eef0f4; --panel:#ffffff; --panel-2:#f5f6f9; --ink:#12213b; --ink-2:#4a566b;
  --ink-3:#8a93a6; --line:#e0e3ea; --line-2:#cdd2dd; --accent:#1f4e9c; --accent-soft:#e5edfa;
  --shadow:0 1px 2px rgba(18,33,59,.05),0 6px 18px rgba(18,33,59,.06);
  /* IIMA node palette */
  --nb-context:#123a6b;  --nb-context-fg:#ffffff;   /* navy root/framing */
  --nb-segment:#c7dcf3;  --nb-segment-fg:#0f2f57;   /* light blue branch */
  --nb-decision:#2668b8; --nb-decision-fg:#ffffff;  /* blue chosen path */
  --nb-option:#d9dde4;   --nb-option-fg:#243043;    /* grey option */
  --nb-metric:#f4d38a;   --nb-metric-fg:#5a4211;    /* amber metric */
  --nb-risk:#f2b7ae;     --nb-risk-fg:#6d211a;      /* red risk */
  --wire:#9fb0c9;
  --hl:#ffb703; --hl-soft:#fff4d6;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --bg:#0f141c; --panel:#161c26; --panel-2:#1c232f; --ink:#e6ebf3; --ink-2:#a9b4c6;
  --ink-3:#6d7788; --line:#26303d; --line-2:#354150; --accent:#5b9bf0; --accent-soft:#16273f;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  --nb-context:#1d4e8f;  --nb-context-fg:#eaf1fb;
  --nb-segment:#284a70;  --nb-segment-fg:#d6e6fb;
  --nb-decision:#357ad6; --nb-decision-fg:#ffffff;
  --nb-option:#333d4c;   --nb-option-fg:#cfd7e3;
  --nb-metric:#6a531f;   --nb-metric-fg:#f6dfa6;
  --nb-risk:#6f342c;     --nb-risk-fg:#f4c1b8;
  --wire:#41546d;
  --hl:#ffc23c; --hl-soft:#2f2712;
}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
h1,h2,h3,h4{margin:0;font-weight:660;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* top bar */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:14.5px;letter-spacing:-.015em;white-space:nowrap}
.brand span{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.search{position:relative}
.search input{width:200px;padding:7px 10px 7px 30px;border:1px solid var(--line-2);border-radius:8px;
  background:var(--panel-2);color:var(--ink);font-size:13px;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:9px;top:8px;opacity:.45}
.tbtn{padding:7px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2);
  font-size:12.5px;font-weight:560;white-space:nowrap}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.hamb{display:none}

.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:100%;overflow-x:clip;
  min-height:calc(100vh - 52px);transition:grid-template-columns .18s}
.wrap.sidecol{grid-template-columns:0 1fr}
.wrap.sidecol .side{display:none}
.wrap.nosidebar{grid-template-columns:1fr}
.wrap.nosidebar .side{display:none}
.reopenSide{position:fixed;left:6px;top:64px;z-index:40;width:26px;height:38px;border-radius:0 9px 9px 0;
  background:var(--panel);border:1px solid var(--line);border-left:none;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-2)}
.reopenSide:hover{color:var(--accent)}
.side{border-right:1px solid var(--line);background:var(--panel);padding:12px 11px 40px;
  position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto}
.side h4{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);
  margin:15px 6px 8px;display:flex;align-items:center;gap:6px}
.side h4:first-child{margin-top:2px}
.side h4 .clr{margin-left:auto;font-size:10px;color:var(--accent);cursor:pointer;text-transform:none;letter-spacing:0}

.fgroup{margin:0 3px 4px}
.fglabel{font-size:10.5px;color:var(--ink-3);font-weight:600;margin:8px 4px 5px}
.fchips{display:flex;flex-wrap:wrap;gap:5px}
.fchip{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--line-2);
  background:var(--panel-2);color:var(--ink-2);line-height:1.3}
.fchip:hover{border-color:var(--accent)}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:560}
.fchip .n{font-family:var(--mono);opacity:.6;font-size:9.5px;margin-left:3px;font-variant-numeric:tabular-nums}
.fchip.on .n{opacity:.85}
.usearch-wrap{position:relative;margin:2px 3px 12px}
.usearch-box{display:flex;align-items:center;flex-wrap:wrap;gap:5px;min-height:36px;padding:6px 9px;
  border:1.5px solid var(--line-2);border-radius:10px;background:var(--panel-2);cursor:text;transition:border-color .15s}
.usearch-box:hover{border-color:var(--ink-3)}
.usearch-box.open{border-color:var(--accent)}
.usearch-box svg{flex:none;opacity:.5}
.usearch-tokens{display:flex;flex-wrap:wrap;gap:4px}
.utoken{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:3px 4px 3px 9px;
  border-radius:20px;background:var(--accent);color:#fff;white-space:nowrap}
.utoken button{background:none;border:none;color:#fff;opacity:.75;cursor:pointer;font-size:14px;line-height:1;padding:1px 4px}
.utoken button:hover{opacity:1}
.usearch-box input{flex:1;min-width:64px;border:none;outline:none;background:transparent;color:var(--ink);font-size:13px}
.usearch-clear{flex:none;border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:16px;padding:0 2px;border-radius:5px;line-height:1}
.usearch-clear:hover{color:var(--ink);background:var(--line)}
.usearch-dropdown{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);max-height:min(380px,62vh);overflow:auto;
  padding:9px;opacity:0;transform:translateY(-5px);pointer-events:none;transition:opacity .14s ease,transform .14s ease}
.usearch-dropdown.open{opacity:1;transform:translateY(0);pointer-events:auto}
.sgroup{margin-bottom:7px}
.sgroup:last-child{margin-bottom:0}
.sgrouplbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:650;padding:4px 7px 3px}
.srow{display:flex;align-items:center;width:100%;gap:8px;padding:6px 7px;border-radius:7px;border:none;
  background:none;text-align:left;cursor:pointer;font-size:12.5px;color:var(--ink-2);transition:background .1s}
.srow:hover{background:var(--panel-2);color:var(--ink)}
.srow.on{color:var(--ink);font-weight:600}
.srow-check{flex:none;width:13px;font-size:11px;color:var(--accent);font-weight:700}
.srow-label{flex:1}
.srow-n{flex:none;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.usearch-empty{padding:10px 6px;color:var(--ink-3);font-size:12px;font-style:italic}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
#main{animation:fadeUp .16s ease}

.citem{display:block;width:100%;text-align:left;padding:8px 9px;border:1px solid transparent;
  border-radius:9px;margin-bottom:3px}
.citem:hover{background:var(--panel-2);border-color:var(--line)}
.citem.on{background:var(--accent-soft);border-color:var(--accent)}
.citem .r1{display:flex;align-items:baseline;gap:7px}
.citem .num{font:650 10px/1 var(--mono);color:var(--ink-3);min-width:20px;padding-top:2px;font-variant-numeric:tabular-nums}
.citem.on .num{color:var(--accent)}
.citem .ttl{font-size:13px;font-weight:570;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.citem .sub{font-size:10.5px;color:var(--ink-3);margin:3px 0 0 27px;display:-webkit-box;
  -webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.dot{width:6px;height:6px;border-radius:50%;background:var(--nb-decision);flex:none;margin-top:5px}
.dot.off{background:var(--line-2)}
.emptside{color:var(--ink-3);font-size:12.5px;font-style:italic;padding:8px}

.main{padding:20px 26px 90px;max-width:1280px;min-width:0}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);
  font-weight:680;margin-bottom:5px}
.chead h1{font-size:24px;line-height:1.18;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--panel);
  border:1px solid var(--line-2);color:var(--ink-2)}
.chip.k{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:560}
.chip.warn{background:var(--nb-risk);border-color:var(--nb-risk);color:var(--nb-risk-fg)}
.prompt{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:10px;padding:13px 16px;box-shadow:var(--shadow)}
.prompt .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);
  font-weight:680;margin-bottom:4px}
.prompt p{margin:0;font-size:15px;line-height:1.5}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 13px;font-size:13px;font-weight:550;color:var(--ink-2);border-bottom:2px solid transparent;
  margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:640}
.tab .cnt{font:650 10px/1 var(--mono);color:var(--ink-3)}
.tab.pll{margin-left:auto;color:var(--ink-3)}

/* ---- IIMA tree ---- */
.treewrap{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);overflow:hidden}
.treebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px 11px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.mini{font-size:11.5px;padding:4px 9px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);font-weight:550}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini.warnb{border-color:var(--nb-risk);color:var(--nb-risk-fg)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.seg button{padding:4px 10px;font-size:11.5px;font-weight:560;background:var(--panel)}
.seg button.on{background:var(--accent);color:#fff}
.seg button:hover:not(.on){color:var(--accent)}
.zoom{display:flex;align-items:center;gap:4px;margin-left:auto}
.zoom button{width:26px;height:26px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);
  font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
.zoom button:hover{border-color:var(--accent);color:var(--accent)}
.zlvl{font:600 11px/1 var(--mono);color:var(--ink-3);min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:5px}
.lg{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:680;letter-spacing:.02em;cursor:pointer;user-select:none;border:1px solid transparent}
.lg.mut{opacity:.3}

.treeport{position:relative;overflow:hidden;cursor:grab;touch-action:none;min-height:280px;
  background:radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0/22px 22px}
.treeport.grabbing{cursor:grabbing}
.treewrap .treeport{height:min(66vh,620px)}
.treeport .tpempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);font-size:13px;font-style:italic;text-align:center;padding:20px}
.treecanvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.nb{position:absolute;width:172px;border-radius:6px;padding:8px 10px;font-size:12.3px;line-height:1.32;
  font-weight:560;cursor:pointer;border:1.5px solid transparent;transition:box-shadow .12s,opacity .18s,transform .12s;
  box-shadow:0 1px 2px rgba(18,33,59,.12)}
.nb .nval{display:block;font-weight:700;font-size:11.5px;margin-top:4px;font-family:var(--mono);
  font-variant-numeric:tabular-nums}
.nb.context{background:var(--nb-context);color:var(--nb-context-fg)}
.nb.segment{background:var(--nb-segment);color:var(--nb-segment-fg)}
.nb.decision{background:var(--nb-decision);color:var(--nb-decision-fg)}
.nb.option{background:var(--nb-option);color:var(--nb-option-fg)}
.nb.metric{background:var(--nb-metric);color:var(--nb-metric-fg)}
.nb.risk{background:var(--nb-risk);color:var(--nb-risk-fg)}
.nb.ghost{opacity:.24;filter:saturate(.4)}
.nb.result{box-shadow:0 0 0 2px var(--nb-context) inset,0 1px 2px rgba(18,33,59,.12)}
.nb.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 2px 8px rgba(18,33,59,.2)}
.nb.hot{border-color:var(--hl);box-shadow:0 0 0 3px var(--hl-soft),0 3px 10px rgba(0,0,0,.18)}
.nb .car{position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;
  background:var(--panel);border:1.5px solid var(--wire);color:var(--ink-2);font-size:11px;display:flex;
  align-items:center;justify-content:center;z-index:3}
.nb .car:hover{border-color:var(--accent);color:var(--accent)}
.opchip{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--panel);
  border:1.5px solid var(--wire);font:700 11px/1 var(--mono);display:flex;align-items:center;
  justify-content:center;color:var(--ink-2);z-index:3}
.wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.wires path{fill:none;stroke:var(--wire);stroke-width:1.6}
.wires path.hot{stroke:var(--hl);stroke-width:2.3}
.thint{font-size:11.5px;color:var(--ink-3);padding:7px 12px;border-top:1px solid var(--line);background:var(--panel-2)}

/* node detail */
.ndetail{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);
  padding:13px 15px;margin-top:13px}
.ndetail .dt{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ndetail .dt .pill{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2.5px 7px;border-radius:5px}
.ndetail h3{font-size:15px;line-height:1.3}
.ndetail p.d{margin:6px 0 0;font-size:13.6px;line-height:1.55;color:var(--ink-2)}
.ndetail .quotes{margin-top:10px;border-top:1px dashed var(--line-2);padding-top:9px}
.ndetail .quotes .ql{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:680;margin-bottom:6px}
.qref{font-size:12.8px;line-height:1.5;padding:5px 0 5px 11px;border-left:2px solid var(--line-2);margin-bottom:5px;color:var(--ink-2)}
.qref b{color:var(--accent);font-weight:640}
.ndetail .hintclick{color:var(--ink-3);font-size:12px;font-style:italic}

/* ---- study / guided replay: 3 resizable + collapsible panes ---- */
.studyWrap{display:flex;flex-direction:column}
.studyRow{display:flex;align-items:stretch;min-height:260px}
.pane{overflow:auto;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:11px}
.pL,.pR{display:flex;flex-direction:column;flex:0 0 auto}
.pC{flex:1 1 auto;min-width:360px;display:flex;flex-direction:column;overflow:hidden}
.pC .treebar{flex:0 0 auto;border-radius:11px 11px 0 0}
.pC .treeport{flex:1 1 auto;min-height:0;height:auto}
.pC .thint{flex:0 0 auto;border-radius:0 0 11px 11px}
.pane.rail{flex:0 0 30px!important;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pane.rail:hover{border-color:var(--accent)}
.pane.rail .railtxt{writing-mode:vertical-rl;font-size:11px;font-weight:650;letter-spacing:.06em;
  color:var(--ink-2);text-transform:uppercase;white-space:nowrap}
.paneHead{padding:9px 11px;border-bottom:1px solid var(--line);background:var(--panel-2);
  display:flex;align-items:center;gap:8px;border-radius:11px 11px 0 0;flex:0 0 auto}
.paneHead b{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);white-space:nowrap}
.paneHead .progress{flex:1;min-width:40px}
.collapseBtn{margin-left:auto;width:24px;height:24px;padding:0;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line-2);border-radius:6px;background:var(--panel);flex:none}
.collapseBtn:hover{border-color:var(--accent);color:var(--accent)}
.gutter{flex:0 0 10px;position:relative;background:transparent}
.gutter::after{content:"";position:absolute;background:var(--line-2);border-radius:2px;transition:background .12s}
.gv::after{left:4px;right:4px;top:8px;bottom:8px;width:2px;margin:0 auto}
.gv{cursor:col-resize}
.gh{height:10px;cursor:row-resize}
.gh::after{top:4px;bottom:4px;left:8px;right:8px;height:2px;margin:auto 0}
.gutter:hover::after,.gutter.active::after{background:var(--accent)}
.progress{height:5px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.scbody{flex:1 1 auto;overflow-y:auto;padding:6px 6px 10px}
.turn{display:grid;grid-template-columns:74px minmax(0,1fr);gap:10px;padding:9px 9px;border-radius:8px;cursor:pointer;margin:2px 0}
.turn:hover{background:var(--panel-2)}
.turn.cur{background:var(--hl-soft);outline:1px solid var(--hl)}
.turn.past{opacity:1}
.turn.future{opacity:.42}
.who{font-size:9.5px;font-weight:750;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.who.i{color:var(--accent)}
.who.c{color:#1a7f52}
.turn>div{min-width:0}
.turn p{margin:0;font-size:13.4px;line-height:1.5;overflow-wrap:break-word}
.turn .tnodes{margin-top:4px;display:flex;flex-wrap:wrap;gap:3px}
.tnode{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:1.5px 5px;border-radius:4px}
.rctrl{display:flex;align-items:center;gap:7px;padding:9px 13px;border-top:1px solid var(--line);background:var(--panel-2);
  border-radius:0 0 11px 11px;flex-wrap:wrap;flex:0 0 auto}
.rbtn{padding:6px 11px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);font-size:12.5px;font-weight:560}
.rbtn:hover{border-color:var(--accent);color:var(--accent)}
.rbtn.play{background:var(--accent);border-color:var(--accent);color:#fff}
.rstep{font:600 11.5px/1 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}

/* cards / framework / qa */
.agrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.card h3 .bar{width:3px;height:12px;border-radius:2px;background:var(--accent)}
.card ul{margin:0;padding-left:17px}.card li{margin-bottom:7px;font-size:13.5px;line-height:1.5}.card li:last-child{margin-bottom:0}
.fwrow{display:grid;grid-template-columns:150px 1fr 1fr;gap:0;border-top:1px solid var(--line)}
.fwrow.h{border-top:none}
.fwrow.h div{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;padding:6px 10px}
.fwrow>div{padding:10px;font-size:13px;line-height:1.5;border-left:1px solid var(--line)}
.fwrow>div:first-child{border-left:none;font-weight:620;color:var(--ink);background:var(--panel-2)}
.fwrow .gen{color:var(--ink-2)}
.qa{padding:10px 0;border-bottom:1px solid var(--line)}.qa:last-child{border-bottom:none}
.qa .q{font-size:13.8px;font-weight:570;margin:0 0 5px}.qa .a{font-size:13.2px;color:var(--ink-2);margin:0;padding-left:12px;border-left:2px solid var(--line-2)}
.pb .q{color:var(--nb-risk-fg)}
.empty{color:var(--ink-3);font-size:13px;font-style:italic;padding:6px 0}
.note{font-size:12.4px;line-height:1.55;color:var(--ink-2);background:var(--hl-soft);border:1px solid var(--hl);border-radius:9px;padding:10px 13px;margin-bottom:14px}
.note.warn{background:var(--nb-risk);border-color:var(--nb-risk);color:var(--nb-risk-fg)}
.note.warn b{color:var(--nb-risk-fg)}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.nav{display:flex;gap:8px;margin-top:22px}
.fw-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow)}
.step .n{font:750 10.5px/1 var(--mono);color:var(--accent);margin-bottom:6px}
.step b{display:block;font-size:14px;margin-bottom:5px}.step p{margin:0;font-size:12.7px;line-height:1.5;color:var(--ink-2)}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}

@media(max-width:1120px){.agrid{grid-template-columns:1fr}}
@media(max-width:900px){
  .studyRow{flex-direction:column;height:auto!important}
  .studyRow .gutter.gv{display:none}
  .gutter.gh{display:none}
  .pane.pL,.pane.pR,.pane.pC{flex:none!important;width:100%}
  .pC{min-width:0;height:60vh}
  .pane.rail .railtxt{writing-mode:horizontal-tb}
  .pane.rail{flex:0 0 40px!important}
}
@media(max-width:860px){
  .wrap{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:52px;width:min(310px,88vw);z-index:45;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .hamb{display:flex}
  #sideToggle,.reopenSide{display:none}
  .main{padding:16px 13px 80px}
  .topbar{gap:8px;padding:9px 11px}.search{flex:1;min-width:0}.search input{width:100%}
  .brand{display:none}
  .fwrow{grid-template-columns:1fr}.fwrow>div{border-left:none}
  .chead h1{font-size:20px}
}

/* ---------------- discipline hub ---------------- */
.hub{max-width:1080px;margin:0 auto;padding:8px 8px 60px;animation:fadeUp .3s ease}
.hhero{max-width:1080px;margin:0 auto;padding:48px 16px 8px;text-align:center}
.hkicker{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.hhero h1{font-size:34px;letter-spacing:-.02em}
.hhero p{max-width:560px;margin:14px auto 0;color:var(--ink-2);font-size:15px}
.hstats{display:flex;gap:26px;justify-content:center;margin:30px 0 10px;flex-wrap:wrap}
.hstat b{display:block;font-size:24px;letter-spacing:-.02em}
.hstat span{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.hgrid{margin-top:30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:13px;text-align:left;width:100%;
  transition:transform .16s ease,border-color .16s ease}
.hcard:not(.soon):hover{transform:translateY(-3px);border-color:var(--accent)}
.hcard.soon{opacity:.55;cursor:default}
.htop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent);flex:none}
.hico svg{width:21px;height:21px}
.hbadge{font-size:10.5px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;padding:4px 8px;
  border-radius:999px;background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line)}
.hbadge.soon{background:var(--nb-metric);color:var(--nb-metric-fg);border-color:transparent}
.hcard h3{font-size:18px}
.hcard p{margin:0;color:var(--ink-2);font-size:13.4px;line-height:1.5}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.hfoot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.hn{font-size:21px;font-weight:700;letter-spacing:-.02em}
.hn small{font-size:11px;font-weight:560;color:var(--ink-3);text-transform:uppercase;margin-left:5px}
.hgo{font-size:12.5px;font-weight:650;color:var(--accent)}
@media(max-width:600px){.hhero h1{font-size:26px}.hstats{gap:16px}}
</style>

<script>
const DATA = {"title": "Casebook Studio", "subtitle": "Interview cases as click-through decision trees. Public demo: 3 original cases.", "disciplines": [{"key": "pm", "label": "Product Management", "source": "demo", "discipline": "Product Management", "subtitle": "3 demo cases written for this portfolio. The full library is private.", "intro": {"id": "pm_overview", "page_range": "-", "title": "Product Management: case methods", "definition": "Each case is a decision tree you click through: clarify, structure, decide, defend.", "steps": [{"step": "Product Design", "detail": "Design or improve a product for a chosen user."}, {"step": "Root Cause Analysis", "detail": "Find why a metric moved before fixing it."}, {"step": "Guesstimate", "detail": "Estimate a number from defensible assumptions."}]}, "cases": [{"id": "demo_pd_stale_applications", "source": "Original demo case, written for this portfolio", "page_range": "-", "title": "Stale Job Applications", "company": "Not specified (fictional)", "industry": "Consumer / Careers", "prompt": "Job seekers on our app apply to dozens of roles and then lose track of them. Design a feature that helps.", "clarifying_questions": [{"q": "Who are our users: students, early-career, or senior professionals?", "a": "Mostly people with 1 to 6 years of experience switching jobs."}, {"q": "What does the business care about: retention, or something like placements?", "a": "Retention first. People churn once their search goes quiet."}, {"q": "Do we see their applications today?", "a": "Only the ones they apply to through us. Most applications happen elsewhere."}], "framework_used": "Product design: user, pain, solutions, prioritise, measure", "decision_tree": [{"id": "n1", "parent": null, "label": "Help job seekers keep track of applications", "detail": "Retention problem: users churn when their search goes quiet and messy.", "type": "context", "turn_refs": [0]}, {"id": "n2", "parent": "n1", "label": "Scope", "detail": "Switchers with 1 to 6 years of experience; retention is the goal; we only see in-app applications.", "type": "context", "turn_refs": [1, 2, 3, 4]}, {"id": "n3", "parent": "n1", "label": "Segments", "detail": "Who loses track, and why.", "type": "segment", "turn_refs": [5]}, {"id": "n4", "parent": "n3", "label": "High-volume appliers", "detail": "Apply to 30+ roles, mostly one-click; can't recall which CV went where.", "type": "segment", "turn_refs": [5]}, {"id": "n5", "parent": "n3", "label": "Referral-led searchers", "detail": "Fewer applications, more people involved; lose track of who promised what.", "type": "segment", "turn_refs": [5]}, {"id": "n6", "parent": "n3", "label": "Target: high-volume appliers", "detail": "Biggest group, and the one whose search goes stale fastest.", "type": "decision", "turn_refs": [6]}, {"id": "n7", "parent": "n6", "label": "Pain: applications live outside our app", "detail": "Confirmation emails are the only complete record.", "type": "context", "turn_refs": [7]}, {"id": "n8", "parent": "n6", "label": "Pain: no signal on when to follow up", "detail": "Silence after applying is ambiguous: still in review, or rejected?", "type": "context", "turn_refs": [7]}, {"id": "n9", "parent": "n6", "label": "Option: import from email", "detail": "Read application confirmations from the user's inbox, with consent, to build the list automatically.", "type": "option", "turn_refs": [8]}, {"id": "n10", "parent": "n6", "label": "Option: follow-up nudges", "detail": "Nudge at 7 days of silence, suggest closing at 21.", "type": "option", "turn_refs": [8]}, {"id": "n11", "parent": "n6", "label": "Option: CV-per-application log", "detail": "Record which CV version each application used; show which converts.", "type": "option", "turn_refs": [8]}, {"id": "n12", "parent": "n6", "label": "Prioritise by value and effort", "detail": "Email import unlocks the other two but needs trust and consent work.", "type": "decision", "turn_refs": [9, 10]}, {"id": "n13", "parent": "n12", "label": "Ship nudges and CV log first, email import as a beta", "detail": "Quick wins on in-app data now; test consent appetite with an opt-in beta.", "type": "decision", "turn_refs": [10], "result": true}, {"id": "n14", "parent": "n1", "label": "Success metrics", "detail": "Did the search stay alive?", "type": "metric", "turn_refs": [11]}, {"id": "n15", "parent": "n14", "label": "Weekly active searchers; follow-ups sent per user", "detail": "Leading signals of an active search.", "type": "metric", "turn_refs": [11]}, {"id": "n16", "parent": "n1", "label": "Risk: inbox access feels invasive", "detail": "Read only application emails, show what was read, and make it one-tap to disconnect.", "type": "risk", "turn_refs": [12]}], "recommendation": ["Target high-volume appliers: the largest group and the one whose search goes stale fastest.", "Ship follow-up nudges and a CV-per-application log on in-app data first; run email import as an opt-in beta.", "Measure weekly active searchers and follow-ups sent, with uninstall rate after inbox consent as a guardrail."], "metrics": ["Weekly active searchers", "Follow-ups sent per user", "Share of applications with a logged outcome", "Guardrail: disconnects and uninstalls after granting inbox access"], "risks": ["Inbox access is a trust jump; a bad first impression can sink the whole feature.", "Nudges that fire too often become noise; cap them and let users snooze."], "interviewer_pushbacks": [{"pushback": "Email import is the most powerful idea. Why not lead with it?", "handling": "It is, but it depends on users trusting us with their inbox. Shipping value on our own data first earns that trust and tells us who would opt in."}, {"pushback": "How do you know nudges at 7 and 21 days are right?", "handling": "They're starting guesses. I'd test the timing against reply rates and adjust."}], "transcript": [{"speaker": "Interviewer", "text": "Job seekers on our app apply to dozens of roles and then lose track of them. Design a feature that helps."}, {"speaker": "Candidate", "text": "Who are the users, and what does the business want: retention or placements?"}, {"speaker": "Interviewer", "text": "Mostly switchers with 1 to 6 years of experience. Retention first, because people churn when their search goes quiet."}, {"speaker": "Candidate", "text": "Do we see all their applications?"}, {"speaker": "Interviewer", "text": "Only the ones made through us. Most happen elsewhere."}, {"speaker": "Candidate", "text": "Two segments lose track: high-volume appliers who one-click 30+ roles and can't recall which CV went where, and referral-led searchers juggling people more than postings."}, {"speaker": "Candidate", "text": "I'll focus on high-volume appliers. They're the biggest group and their search goes stale fastest."}, {"speaker": "Candidate", "text": "Their pains: the full record lives in confirmation emails, not in our app, and silence after applying gives no signal on when to follow up."}, {"speaker": "Candidate", "text": "Options: import applications from email with consent; nudge at 7 days of silence and suggest closing at 21; and log which CV each application used so users see what converts."}, {"speaker": "Interviewer", "text": "How would you prioritise?"}, {"speaker": "Candidate", "text": "Email import unlocks the rest but needs trust. So I'd ship nudges and the CV log on in-app data now, and run email import as an opt-in beta."}, {"speaker": "Candidate", "text": "Success is weekly active searchers and follow-ups sent per user."}, {"speaker": "Candidate", "text": "The main risk is that inbox access feels invasive, so I'd read only application emails, show exactly what was read, and make disconnecting one tap."}], "key_takeaway": "Sequence by trust, not by power. The strongest feature waits until cheaper ones have earned the user's permission.", "extraction_notes": "Written for this demo; inspired by the problem behind Switch Board.", "facets": {"case_type": "Product Design", "industry": "Consume t": "n1", "label": "Clarify the metric and timing", "detail": "Completed over initiated, in-app. Sudden onset on Tuesday afternoon, same day as release 6.2.", "type": "context", "turn_refs": [1, 2, 3, 4]}, {"id": "n3", "parent": "n1", "label": "External causes", "detail": "Check what we do not control before blaming our own release.", "type": "segment", "turn_refs": [5]}, {"id": "n4", "parent": "n3", "label": "Bank or PSP downtime", "detail": "NPCI and partner bank status, failure codes from the switch.", "type": "option", "turn_refs": [5, 6]}, {"id": "n5", "parent": "n3", "label": "Seasonality or demand mix", "detail": "Festive spikes or a promo pulling in new, less reliable payers.", "type": "option", "turn_refs": [5, 6]}, {"id": "n6", "parent": "n1", "label": "Internal causes", "detail": "Things we changed: release 6.2, backend config, risk rules.", "type": "segment", "turn_refs": [5]}, {"id": "n7", "parent": "n6", "label": "Segment the drop", "detail": "Cut by app version, OS, bank, amount band and new vs returning users.", "type": "decision", "turn_refs": [7, 8]}, {"id": "n8", "parent": "n7", "label": "Only version 6.2 on Android drops", "detail": "iOS and older Android versions hold at 94%. The drop lives in one build.", "type": "metric", "turn_refs": [8], "value": "6.2 Android: 81%"}, {"id": "n9", "parent": "n8", "label": "Funnel inside 6.2", "detail": "Initiated, PIN screen shown, PIN entered, bank response, success screen.", "type": "decision", "turn_refs": [9]}, {"id": "n10", "parent": "n9", "label": "Users drop at the PIN screen", "detail": "PIN-screen-shown to PIN-entered fell sharply; bank responses look normal.", "type": "metric", "turn_refs": [10], "value": "PIN entry -9 pts"}, {"id": "n11", "parent": "n10", "label": "Hypothesis: new PIN screen breaks on some keyboards", "detail": "6.2 redesigned the PIN entry. Third-party keyboards may not open the numeric pad.", "type": "decision", "turn_refs": [11]}, {"id": "n12", "parent": "n11", "label": "Validate with session data and a repro", "detail": "Check device and keyboard logs, reproduce on two popular keyboards, read support tickets.", "type": "decision", "turn_refs": [12]}, {"id": "n13", "parent": "n1", "label": "Recommendation", "detail": "Roll back the PIN screen behind a flag today; fix and re-release with keyboard coverage tests.", "type": "decision", "turn_refs": [13], "result": true}, {"id": "n14", "parent": "n13", "label": "Watch: success rate by version, hourly", "detail": "Confirms the rollback worked and catches a repeat.", "type": "metric", "turn_refs": [13]}, {"id": "n15", "parent": "n13", "label": "Risk: lost trust from failed payments", "detail": "Users who failed may switch apps. Consider a nudge or cashback for affected users.", "type": "risk", "turn_refs": [13]}], "recommendation": ["Roll back the redesigned PIN screen behind a feature flag today; that recovers most of the drop if the hypothesis holds.", "Fix keyboard handling, add device and keyboard coverage to release testing, and re-release with a staged rollout.", "Reach out to users who failed a payment this week, since a failed payment costs more trust than a slow one."], "metrics": ["Payment success rate by app version and OS, hourly", "PIN-screen-shown to PIN-entered conversion", "Repeat payment rate of users who failed this week"], "risks": ["The keyboard hypothesis may only explain part of the drop; keep checking bank failure codes in parallel.", "A rollback can reintroduce whatever the redesign fixed; check what 6.2 was meant to solve."], "interviewer_pushbacks": [{"pushback": "Why not start with the banks? Bank downtime is the usual cause.", "handling": "Ruled it out quickly with data: the drop is confined to one app build, and bank responses are normal. Segmenting first saved chasing the wrong cause."}, {"pushback": "Would you roll back without being sure?", "handling": "Yes, behind a flag. A payments failure is expensive for users, and a flag makes the rollback cheap to reverse."} /* ---------------- tree model ---------------- */
function buildRoots(c){
  const map={}, roots=[];
  c.decision_tree.forEach(n=>map[n.id]={...n,kids:[]});
  c.decision_tree.forEach(n=> n.parent&&map[n.parent] ? map[n.parent].kids.push(map[n.id]) : roots.push(map[n.id]));
  return {roots,map};
}
function ancestors(c,id){const m={};c.decision_tree.forEach(n=>m[n.id]=n);const a=[];let p=m[id];while(p&&p.parent){a.push(p.parent);p=m[p.parent];}return a;}

/* reveal model for guided replay */
function replayModel(c){
  const nodes=c.decision_tree;
  const hasT=c.transcript&&c.transcript.length;
  if(hasT){
    const earliest={}; nodes.forEach(n=>earliest[n.id]=(n.turn_refs&&n.turn_refs.length)?Math.min(...n.turn_refs):Infinity);
    return {
      hasT:true, len:c.transcript.length,
      revealedAt:k=>{const s=new Set();nodes.forEach(n=>{if(earliest[n.id]<=k)s.add(n.id)});
        if(k>=c.transcript.length-1)nodes.forEach(n=>s.add(n.id));
        [...s].forEach(id=>ancestors(c,id).forEach(a=>s.add(a))); if(nodes[0])s.add(nodes[0].id); return s;},
      hotAt:k=>new Set(nodes.filter(n=>(n.turn_refs||[]).includes(k)).map(n=>n.id))
    };
  }
  return {
    hasT:false, len:nodes.length,
    revealedAt:k=>{const s=new Set();for(let i=0;i<=k&&i<nodes.length;i++){s.add(nodes[i].id);ancestors(c,nodes[i].id).forEach(a=>s.add(a));}if(nodes[0])s.add(nodes[0].id);return s;},
    hotAt:k=>new Set(nodes[k]?[nodes[k].id]:[])
  };
}

    const r=host.getBoundingClientRect(), cx=e.clientX-r.left, cy=e.clientY-r.top;
    const wx=(cx-p.x)/p.z, wy=(cy-p.y)/p.z;
    const nz=Math.min(3,Math.max(0.25, p.z*(e.deltaY<0?1.12:1/1.12)));
    p.x=cx-wx*nz; p.y=cy-wy*nz; p.z=nz;
    applyTransform(canvas,p);
  },{passive:false});
  let dragging=false, moved=0;
  host.addEventListener("pointerdown",e=>{
    if(e.target.closest(".nb")) return;
    dragging=true; moved=0; host.classList.add("grabbing");
    try{ host.setPointerCapture(e.pointerId); }catch(err){}
  });
  host.addEventListener("pointermove",e=>{
    if(!dragging) return;
    p.x+=e.movementX; p.y+=e.movementY;
    moved+=Math.abs(e.movementX)+Math.abs(e.movementY);
    applyTransform(canvas,p);
  });
  const end=e=>{
    if(!dragging) return;
    if(moved>5){ justPanned=true; setTimeout(()=>{justPanned=false;},0); }
    dragging=false; host.classList.remove("grabbing");
  };
  host.addEventListener("pointerup",end);
  host.addEventListener("pointercancel",end);
}

/* ---------------- layout engine (LR / TB) ---------------- */
function layoutTree(vroots, els, dir, vKids){
  const PADX=14, PADY=14, GAPY=12, GAPX=22, COLW=200, ROWV=104, BW=172;
  let maxX=0, maxY=0;
  if(dir==="TB"){
    let cursor=PADX;
    (function walk(){
      function place(n,depth){
        const el=els[n.id]; const h=el.offsetHeight; n._h=h;
        n._y=PADY+depth*ROWV; maxY=Math.max(maxY,n._y+h);
        const kids=vKids(n);
        if(!kids.length){ n._x=cursor; cursor+=BW+GAPX; }
        else{
          kids.forEach(k=>place(k,depth+1));
          const f=kids[0], l=kids[kids.length-1];
          n._x=((f._x+BW/2)+(l._x+BW/2))/2 - BW/2;
        }
        maxX=Math.max(maxX,n._x+BW);
      }
      vroots.forEach(r=>place(r,0));
    })();
    return {W:maxX+PADX+16, H:maxY+PADY+16};
  }
  let cursor=PADY;
  function place(n,depth){
    const el=els[n.id]; const h=el.offsetHeight; n._h=h;
    n._x=PADX+depth*COLW; maxX=Math.max(maxX,n._x);
    const kids=vKids(n);
    if(!kids.length){ n._y=cursor; cursor+=h+GAPY; }
    else{
      kids.forEach(k=>place(k,depth+1));
      const f=kids[0], l=kids[kids.length-1];
      n._y=((f._y+els[f.id].offsetHeight/2)+(l._y+els[l.id].offsetHeight/2))/2 - h/2;
    }
  }
  vroots.forEach(r=>place(r,0));
  return {W:maxX+BW+PADX+16, H:cursor+PADY};
}

/* ---------------- IIMA tree renderer ---------------- */
/* opts: {revealed:Set|null(all), hot:Set, onSelect, host } ; returns nothing, fills host */
function renderTree(host,c,opts){
  const cid=c.id;
  if(!c.decision_tree || !c.decision_tree.length){
    host.innerHTML=`<div class="tpempty">No decision tree for this case.</div>`;
    return;
  }
  const {roots,map}=buildRoots(c);
  const collapsed=S.collapsed[c.id]||(S.collapsed[c.id]={});
  const muted=S.muted[c.id]||(S.muted[c.id]={});
  const revealed=opts.revealed; // null = all solid; else unrevealed rendered as ghosts (layout stays stable)
  const isVisible=n=> !muted[n.type];
  function vKids(n){ if(collapsed[n.id]) return []; return n.kids.filter(isVisible); }

  const canvas=document.createElement("div"); canvas.className="treecanvas";
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg"); svg.setAttribute("class","wires");
  canvas.appendChild(svg);

  const els={};
  const vroots=roots.filter(isVisible);
  function makeEl(n){
    const el=document.createElement("div");
    el.className="nb "+n.type+(revealed&&!revealed.has(n.id)?" ghost":"")+(n.result?" result":"");
    el.dataset.id=n.id;
    el.tabIndex=0; el.setAttribute("role","button");
    el.setAttribute("aria-pressed", S.sel[c.id]===n.id ? "true":"false");
    el.setAttribute("aria-label", n.label||"");
    el.innerHTML=esc(n.label)+(n.value?`<span class="nval">${esc(n.value)}</span>`:"");
    const kids=vKids(n);
    const allKids=n.kids.filter(k=>!muted[k.type]);
    if(allKids.length){
      const car=document.createElement("button"); car.className="car"; car.textContent=collapsed[n.id]?"+":"–";
      car.setAttribute("aria-label",(collapsed[n.id]?"Expand ":"Collapse ")+(n.label||"node"));
      car.dataset.toggle=n.id; el.appendChild(car);
    }
    canvas.appendChild(el); els[n.id]=el;
    kids.forEach(makeEl);
  }
  vroots.forEach(makeEl);
  host.innerHTML=""; host.appendChild(canvas);

  const dir=getLayout(cid);
  const {W,H}=layoutTree(vroots, els, dir, vKids);
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  svg.setAttribute("width",W); svg.setAttribute("height",H); svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  function walkPos(n){const el=els[n.id]; el.style.left=n._x+"px"; el.style.top=n._y+"px"; vKids(n).forEach(walkPos);}
  vroots.forEach(walkPos);

  // wires (+ operator chips on the connector into a node that has `op`)
  function wire(n){
    vKids(n).forEach(k=>{
      const kel=els[k.id];
      let d, midx, midy;
      if(dir==="TB"){
        const px=n._x+86, py=n._y+n._h, cx=k._x+86, cy=k._y, my=py+(cy-py)/2;
        d=`M ${px} ${py} V ${my} H ${cx} V ${cy}`; midx=cx; midy=my;
      } else {
        const px=n._x+172, py=n._y+n._h/2, cx=k._x, cy=k._y+kel.offsetHeight/2, mx=px+(cx-px)/2;
        d=`M ${px} ${py} H ${mx} V ${cy} H ${cx}`; midx=mx; midy=cy;
      }
      const p=document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("d",d);
      const hot=opts.hot&&opts.hot.has(n.id)&&opts.hot.has(k.id);
      if(hot)p.setAttribute("class","hot");
      svg.appendChild(p);
      if(k.op){
        const chip=document.createElement("div"); chip.className="opchip"; chip.setAttribute("aria-hidden","true");
        chip.style.left=(midx-9)+"px"; chip.style.top=(midy-9)+"px";
        chip.textContent=k.op;
        canvas.appendChild(chip);
      }
      wire(k);
    });
  }
  vroots.forEach(wire);

  // states
  Object.entries(els).forEach(([id,el])=>{
    if(opts.hot&&opts.hot.has(id)) el.classList.add("hot");
    if(S.sel[c.id]===id){ el.classList.add("sel"); el.setAttribute("aria-pressed","true"); }
  });

  // mount pan/zoom
  const p=getPan(cid);
  if(!p.fitted){ fitToView(host,canvas,p,W,H); p.fitted=true; }
  else applyTransform(canvas,p);
  wirePanZoom(host,canvas,cid,p);
  LT={cid,host,canvas,p,W,H};

  // node select: click (guarded against a just-finished background drag) + keyboard
  host.querySelectorAll(".nb").forEach(el=>{
    const doSelect=()=>{
      const id=el.dataset.id; S.sel[c.id]= S.sel[c.id]===id?null:id;
      const _y=window.scrollY;
      if(opts.onSelect) opts.onSelect(id); else render();
      requestAnimationFrame(()=>window.scrollTo(0,_y));
    };
    el.onclick=e=>{
      if(justPanned) return;
      if(e.target.dataset.toggle!=null){ const id=e.target.dataset.toggle; collapsed[id]=!collapsed[id]; render(); return; }
      doSelect();
    };
    el.onkeydown=e=>{
      if(e.key==="Enter"||e.key===" "){ e.preventDefault(); doSelect(); }
    };
  });
}

function wireTreeBar(c){

    render();
  });
  m.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>{
    const on=b.dataset.all==="1", col=S.collapsed[c.id]||(S.collapsed[c.id]={});
    c.decision_tree.forEach(n=>{const d=ancestors(c,n.id).length; col[n.id]= on?false:(d>=1);});
    render();
  });
  m.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>{
    const mu=S.muted[c.id]||(S.muted[c.id]={}); mu[b.dataset.mt]=!mu[b.dataset.mt]; render();
  });
  m.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{
    if(!LT||LT.cid!==c.id) return;
    const {host,canvas,p,W,H}=LT;
    if(b.dataset.z==="fit"){ fitToView(host,canvas,p,W,H); return; }
    const vw=host.clientWidth||600, vh=host.clientHeight||400, cx=vw/2, cy=vh/2;
    const wx=(cx-p.x)/p.z, wy=(cy-p.y)/p.z;
    const nz= b.dataset.z==="+"? Math.min(3,p.z*1.2) : Math.max(0.25,p.z/1.2);
    p.x=cx-wx*nz; p.y=cy-wy*nz; p.z=nz;
    applyTransform(canvas,p);
  });
}

    }).join("");
  }
  const srcLabel=rm.hasT?"Interview transcript":"Reasoning steps (no transcript in source)";
  const lc=S.paneCollapsed.left, rc=S.paneCollapsed.right;

  const leftPane = lc
    ? `<section class="pane pL rail" id="pLrail" data-side="left" role="button" tabindex="0" aria-expanded="false" aria-label="Expand transcript panel"><span class="railtxt">Transcript</span></section>`
    : `<section class="pane pL" style="flex:0 0 ${S.paneW.left}px">
        <div class="paneHead"><b>${srcLabel}</b><div class="progress"><i style="width:${pct}%"></i></div>
          <button class="mini collapseBtn" data-collapse="left" aria-expanded="true" aria-label="Collapse transcript panel">‹</button></div>
        <div class="scbody" id="scbody">${rows}</div>
        <div class="rctrl">
          <button class="rbtn" data-r="first" aria-label="Jump to first step">⏮</button>
          <button class="rbtn" data-r="prev">◀ Prev</button>
          <button class="rbtn play" data-r="play">${S.playing?"❚❚ Pause":(st.started?"▶ Play":"▶ Watch it build")}</button>
          <button class="rbtn" data-r="next">Next ▶</button>
          <span class="rstep">${st.started?(k+1)+" / "+rm.len:"full tree"}</span>
          <span class="spacer" style="flex:1"></span>
          <button class="rbtn" data-r="all" title="Show the complete tree">Overview</button>
        </div>
      </section>`;
  const rightPane = rc
    ? `<section class="pane pR rail" id="pRrail" data-side="right" role="button" tabindex="0" aria-expanded="false" aria-label="Expand detail panel"><span class="railtxt">Detail</span></section>`
    : `<section class="pane pR" style="flex:0 0 ${S.paneW.right}px">
        <div class="paneHead"><b>Node detail</b>
          <button class="mini collapseBtn" data-collapse="right" aria-expanded="true" aria-label="Collapse detail panel">›</button></div>
        <div style="padding:2px 8px 10px">${nodeDetail(c)}</div>
      </section>`;

  return `<div class="studyWrap">
    <div class="studyRow" style="height:${S.studyH}px">

      ${lc?"":'<div class="gutter gv" data-g="left" role="separator" aria-orientation="vertical" aria-label="Resize transcript panel" tabindex="0"></div>'}
      <section class="pane pC">${treeBar(c,false)}<div class="treeport" id="tport"></div>
        <div class="thint">The tree builds as the interview unfolds. Ghosted boxes haven't been reached yet · gold = the move made on the highlighted line.</div>
      </section>
      ${rc?"":'<div class="gutter gv" data-g="right" role="separator" aria-orientation="vertical" aria-label="Resize detail panel" tabindex="0"></div>'}

function wireStudyGutters(c){
  const wrap=document.querySelector(".studyWrap"); if(!wrap) return;
  const refit=()=>{ if(S.view!=="intro") getPan(S.view).fitted=false; };
  wrap.querySelectorAll(".gutter.gv").forEach(g=>{
    let startX=0,startL=0,startR=0,dragging=false;
    g.addEventListener("pointerdown",e=>{
      dragging=true; startX=e.clientX; startL=S.paneW.left; startR=S.paneW.right;
      try{g.setPointerCapture(e.pointerId);}catch(err){} g.classList.add("active");
    });
    g.addEventListener("pointermove",e=>{
      if(!dragging) return;
      const dx=e.clientX-startX;
      if(g.dataset.g==="left"){
        S.paneW.left=Math.max(220,Math.min(560,startL+dx));
        const pane=wrap.querySelector(".pane.pL"); if(pane) pane.style.flex=`0 0 ${S.paneW.left}px`;
      } else {
        S.paneW.right=Math.max(240,Math.min(560,startR-dx));
        const pane=wrap.querySelector(".pane.pR"); if(pane) pane.style.flex=`0 0 ${S.paneW.right}px`;
      }
    });
    const end=()=>{ if(!dragging) return; dragging=false; g.classList.remove("active"); refit(); render(); };
    g.addEventListener("pointerup",end); g.addEventListener("pointercancel",end);
    g.addEventListener("keydown",e=>{
      if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight") return;
      e.preventDefault(); const step=16, dir=e.key==="ArrowLeft"?-1:1;
      if(g.dataset.g==="left") S.paneW.left=Math.max(220,Math.min(560,S.paneW.left+dir*step));
      else S.paneW.right=Math.max(240,Math.min(560,S.paneW.right-dir*step));
      refit(); render();
    });
  });
  const gh=wrap.querySelector(".gutter.gh");
  if(gh){
    let startY=0,startH=0,dragging=false;
    gh.addEventListener("pointerdown",e=>{
      dragging=true; startY=e.clientY; startH=S.studyH;
      try{gh.setPointerCapture(e.pointerId);}catch(err){} gh.classList.add("active");
    });
    gh.addEventListener("pointermove",e=>{
      if(!dragging) return;
      S.studyH=Math.max(320,Math.min(900,startH+(e.clientY-startY)));
      const row=wrap.querySelector(".studyRow"); if(row) row.style.height=S.studyH+"px";
    });
    const end=()=>{ if(!dragging) return; dragging=false; gh.classList.remove("active"); refit(); render(); };
    gh.addEventListener("pointerup",end); gh.addEventListener("pointercancel",end);
    gh.addEventListener("keydown",e=>{
      if(e.key!=="ArrowUp"&&e.key!=="ArrowDown") return;
      e.preventDefault(); const step=16, dir=e.key==="ArrowUp"?-1:1;
      S.studyH=Math.max(320,Math.min(900,S.studyH+dir*step));
      refit(); render();
    });
  }
  wrap.querySelectorAll("[data-collapse]").forEach(b=>b.onclick=()=>{
    S.paneCollapsed[b.dataset.collapse]=true; refit(); render();
  });
  const railL=document.getElementById("pLrail");
  if(railL){
    const open=()=>{ S.paneCollapsed.left=false; refit(); render(); };
    railL.onclick=open; railL.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}};
  }
  const railR=document.getElementById("pRrail");
  if(railR){
    const open=()=>{ S.paneCollapsed.right=false; refit(); render(); };
    railR.onclick=open; railR.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}};
  }
}

      <b>${esc(s.step.replace(/^\d+\.\s*/,""))}</b><p>${esc(s.detail)}</p></div>`).join("")}</div>
    ${COV?`<div class="agrid" style="margin-top:18px">
      <div>${cell("Coverage",[COV.built+" cases built",COV.flagged+" flagged \u2192 Framework Library"].concat(Object.entries(COV.by_type||{}).map(e=>e[0]+": "+e[1])))}</div>
      <div>${cell("Framework Library",["Open the sidebar \u2192 Framework Library for the "+frameworks.length+" methods & references this module teaches."],"var(--nb-metric)")}</div>
    </div>`:(intro.pricing_approaches?`<div class="agrid" style="margin-top:18px">
      <div>${cell("Pricing approaches",intro.pricing_approaches)}${cell("Marketing funnel",intro.marketing_funnel)}</div>
      <div>${cell("Metrics the book suggests",intro.example_metrics,"var(--nb-metric)")}${cell("Risks the book suggests",intro.example_risks,"var(--nb-risk)")}</div>
    </div>`:"")}`;
}

/* ---------------- render ---------------- */
function frameworksView(){
  const fw=frameworks.map(f=>`<div class="step"><div class="n">${esc(f.page?("p."+f.page):"REF")}</div><b>${esc(f.name)}</b><p>${esc(f.when_to_use||f.definition||"")}</p>${(f.steps&&f.steps.length)?`<ul>${f.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}</div>`).join("");
  return `<div class="chead"><div class="kicker">${esc(DISC)} · Framework Library</div><h1>Frameworks & Methods</h1><div class="chips"><span class="chip k">${frameworks.length} entries</span></div></div>
    <div class="prompt"><div class="lbl">How to use</div><p>Reference scaffolds the cases apply. Open any case for a worked example.</p></div>
    <div class="fw-cards">${fw}</div>`;
}
function render(){
  const wrap=document.querySelector(".wrap");
  const toHub=document.getElementById("toHub"), sideToggle=document.getElementById("sideToggle"), hamb=document.getElementById("hamb");
  if(MULTI && !S.discipline){
    document.getElementById("subtitle").textContent=DATA.subtitle||"";
    document.getElementById("side").innerHTML="";
    wrap.classList.add("nosidebar");
    if(toHub) toHub.style.display="none";
    if(sideToggle) sideToggle.style.display="none";
    if(hamb) hamb.style.display="none";
    document.getElementById("main").innerHTML=hubView();
    wireHub();
    return;
  }
  wrap.classList.remove("nosidebar");
  if(toHub) toHub.style.display=MULTI?"":"none";
  if(sideToggle) sideToggle.style.display="";
  if(hamb) hamb.style.display="";
  const _st=document.getElementById("subtitle");
  if(_st) _st.textContent = MULTI ? (DATA.disciplines.find(d=>d.key===S.discipline)||{}).subtitle||"" : (DATA.subtitle||"");
  renderSide();
  const main=document.getElementById("main");
  if(S.view==="intro"){ main.innerHTML=introView(); wireStatic(); mountTree(); return; }
  if(S.view==="frameworks"){ main.innerHTML=frameworksView(); wireStatic(); return; }
  const c=byId(S.view), i=cases.indexOf(c);
  const warn=/misplaced|apparently|not actually|does not actually/i.test((c.extraction_notes||"")+(c.page_range||""));
  const tabs=[["tree","Decision tree"],["study","Guided replay"],["framework","Framework map"],
              ["qa","Q&A + pushbacks"],["practice","Practice"]];
  let body = S.tab==="study"?studyView(c): S.tab==="tree"?treeTab(c):
             S.tab==="framework"?frameworkTab(c): S.tab==="qa"?qaTab(c): practiceView(c);
  main.innerHTML=`<div class="chead"><div class="kicker">Case ${String(i+1).padStart(2,"0")} of ${cases.length} · ${esc(c.facets.difficulty)}</div>
      <h1>${esc(c.title)}</h1>
      <div class="chips"><span class="chip k">${esc(c.facets.industry)}</span>
        ${c.facets.emphasis.map(e=>`<span class="chip">${esc(e)}</span>`).join("")}
        ${warn?'<span class="chip warn">source anomaly — see footnote</span>':""}</div></div>
    <div class="prompt"><div class="lbl">Interviewer prompt</div><p>${esc(c.prompt)}</p></div>
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab ${S.tab===k?"on":""} ${k==='practice'?'pll':''}" data-tab="${k}" role="tab" aria-selected="${S.tab===k}">${l}</button>`).join("")}</div>
    ${body}
    <div class="nav"><button class="mini" data-go="-1">← Previous</button><button class="mini" data-go="1">Next →</button></div>
    <div class="foot">${c.extraction_notes?`<div style="max-width:640px"><b>Extraction footnote:</b> ${esc(c.extraction_notes)}</div>`:""}
      <div>${esc(c.source||"")}</div></div>`;
  wireStatic(c); mountTree(c);
  if(S.tab==="study") wireStudyGutters(c);
}
function mountTree(c){
  const host=document.getElementById("tport"); if(!host||!c) return;
  if(S.tab==="tree"){ renderTree(host,c,{revealed:null,hot:null,onSelect:null}); wireTreeBar(c); }
  else if(S.tab==="study"){
    const st=studyState(c);
    renderTree(host,c,{revealed:st.revealed,hot:st.hot,
      onSelect:id=>{ const n=c.decision_tree.find(x=>x.id===id);
        if(st.started && n&&n.turn_refs&&n.turn_refs.length){ S.step[c.id]=Math.max(...n.turn_refs); }
        render(); scrollCur(); }});
    wireTreeBar(c);
  }
}
function scrollCur(){const b=document.getElementById("scbody");if(!b)return;const cur=b.querySelector(".turn.cur");if(cur)cur.scrollIntoView({block:"nearest"});}
function wireStatic(c){
  const m=document.getElementById("main");
  m.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{stopPlay();S.tab=b.dataset.tab;render()});
  m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{stopPlay();step(+b.dataset.go)});
  m.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>replayCtl(c,b.dataset.r));
  m.querySelectorAll("[data-step]").forEach(t=>t.onclick=()=>{stopPlay();S.step[c.id]=+t.dataset.step;render();scrollCur();});
}
function replayCtl(c,cmd){
  const rm=replayModel(c); const wasStarted=S.started[c.id]; let k=S.step[c.id]||0;
  if(cmd==="all"){ stopPlay(); S.started[c.id]=false; S.step[c.id]=rm.len-1; render(); return; }
  if(cmd==="play"){
    if(S.playing){ stopPlay(); render(); return; }
    if(!wasStarted || k>=rm.len-1){ S.started[c.id]=true; k=0; }   // (re)start build from 0
    S.started[c.id]=true; S.step[c.id]=k; S.playing=true;
    S.playH=setInterval(()=>{ let kk=(S.step[c.id]||0)+1; if(kk>=rm.len){stopPlay();render();return;} S.step[c.id]=kk;render();scrollCur(); },1400);
    render(); scrollCur(); return;
  }
  S.started[c.id]=true;
  if(cmd==="first"){stopPlay();k=0}
  else if(cmd==="prev"){stopPlay(); k=wasStarted?Math.max(0,k-1):0}
  else if(cmd==="next"){stopPlay(); k=wasStarted?Math.min(rm.len-1,k+1):0}
  S.step[c.id]=k; render(); scrollCur();
}
function stopPlay(){S.playing=false;if(S.playH){clearInterval(S.playH);S.playH=null;}}
function step(d){
  const i=S.view==="intro"?-1:cases.indexOf(byId(S.view)); const ni=i+d;
  if(ni<0)S.view="intro"; else if(ni<cases.length){S.view=cases[ni].id;S.seen[S.view]=true;} else return;
  S.tab="tree"; render(); window.scrollTo(0,0);
}

/* practice (de-emphasised) */
function practiceView(c){
  const spine=buildRoots(c).roots[0]; const items=(spine?spine.kids:[]).map(k=>k.label);
  return `<div class="note">Practice mode: structure your own answer before revealing. Learning-first — the guided replay and decision tree are the main tools.</div>
    <div class="card"><h3><span class="bar"></span>Your structure</h3>
      <textarea id="pnotes" style="width:100%;min-height:150px;padding:11px;border:1px solid var(--line-2);border-radius:9px;background:var(--panel-2);color:var(--ink);font:14px/1.6 inherit" placeholder="What are you solving for? Who's the customer? Options? How will you measure it?"></textarea></div>
    <div class="card"><h3><span class="bar"></span>Top-level branches the casebook used</h3>
      <ul>${items.length?items.map(t=>`<li>${esc(t)}</li>`).join(""):'<li>—</li>'}</ul></div>`;
}

/* ---------------- sidebar collapse (desktop, explicit — independent of mobile hamburger) ---------------- */
function renderReopenBtn(){
  let btn=document.getElementById("reopenSide");
  if(S.sideCollapsed){
    if(!btn){
      btn=document.createElement("button"); btn.id="reopenSide"; btn.className="reopenSide";
      btn.setAttribute("aria-label","Show sidebar"); btn.textContent="›";
      btn.onclick=()=>{
        S.sideCollapsed=false; document.querySelector(".wrap").classList.remove("sidecol");
        document.getElementById("sideToggle").setAttribute("aria-expanded","true");
        btn.remove();
      };
      document.body.appendChild(btn);
    }
  } else if(btn) btn.remove();
}
document.getElementById("sideToggle").onclick=()=>{
  S.sideCollapsed=!S.sideCollapsed;
  document.querySelector(".wrap").classList.toggle("sidecol",S.sideCollapsed);
  document.getElementById("sideToggle").setAttribute("aria-expanded",(!S.sideCollapsed).toString());
  renderReopenBtn();
};

/* global */
document.addEventListener("click",e=>{
  if(!S.searchOpen) return;
  const wrap=document.querySelector(".usearch-wrap");
  if(wrap && !wrap.contains(e.target)){ S.searchOpen=false; renderSide(); }
});
document.getElementById("theme").onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";render();};
document.getElementById("hamb").onclick=()=>document.getElementById("side").classList.toggle("open");
const toHubBtn=document.getElementById("toHub");
if(toHubBtn) toHubBtn.onclick=()=>{ S.discipline=null; S.searchOpen=false; render(); };
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(MULTI&&!S.discipline)return;
  if(S.view!=="intro"&&S.tab==="study"){ if(e.key==="ArrowRight"){replayCtl(byId(S.view),"next")} if(e.key==="ArrowLeft"){replayCtl(byId(S.view),"prev")} }
  if(e.key==="j")step(1); if(e.key==="k")step(-1); if(e.key==="/"){e.preventDefault();S.searchOpen=true;renderSide();const i=document.getElementById("usinput");if(i)i.focus();}
});
if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)document.documentElement.dataset.theme="dark";
if(!MULTI){
  loadDiscipline(null);
}else{
  let startDisc=null;
  try{
    const last=localStorage.getItem("cbstudio_lastDiscipline");
    if(last && DATA.disciplines.some(d=>d.key===last && !d.planned)) startDisc=last;
  }catch(e){}
  if(startDisc){ S.discipline=startDisc; loadDiscipline(startDisc); }
}
render();
</script>
